[pytest]
; Makes the repo root importable as `include.*` (and any other top-level
; package) regardless of the current working directory pytest is invoked
; from. Without this, `from include.quality_checks import ...` in
; tests/test_quality_checks.py only resolves by accident, depending on
; how the caller's environment happens to set up sys.path -- it failed
; outright in GitHub Actions CI with "ModuleNotFoundError: No module
; named 'include'" even though the same command works locally for some
; setups. This is the standard, portable fix (pytest's own supported
; pythonpath option, not a CI-only workaround), so it fixes the import
; the same way for CI, a fresh clone, and any contributor's machine.
pythonpath = .

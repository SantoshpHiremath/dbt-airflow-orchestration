name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run fast unit, structural, and warehouse-integration tests
        run: pytest tests/test_quality_checks.py tests/test_dag_structure.py tests/test_quality_checks_against_real_warehouse.py -v

  dag-end-to-end:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize Airflow metadata DB
        run: |
          export AIRFLOW_HOME=/tmp/airflow_ci
          airflow db init
      - name: Run real end-to-end DAG test (airflow dags test)
        run: |
          export AIRFLOW_HOME_TEST=/tmp/airflow_ci
          pytest tests/test_dag_end_to_end.py -v
